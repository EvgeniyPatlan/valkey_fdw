name: Packages

# Separate from CI, because it answers a different question.
#
# CI asks whether the code is correct. This asks whether the thing a user
# installs is the thing this repository describes - which is not the same
# question and does not have the same failure modes. A spec file can be wrong
# in ways no suite can see: a licence that does not travel with the binary it
# covers, a file left in the buildroot, a glob that quietly widens to catch
# something the tree says must not ship.
#
# It runs on the same events as CI rather than only on a tag. Packaging breaks
# from ordinary edits - a new source file, a renamed script, an added extension
# - and finding that out at release time means finding it out under pressure.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Every target against every supported PostgreSQL major.
    #
    # The packaging is mostly shared across majors, so most of these cells ask
    # a similar question - but not the same one. Each major has its own PGDG
    # package set, its own server-dev headers, and on the RPM side its own
    # answer to whether the repository carries that major for that EL release
    # at all. Those are exactly the differences a smaller matrix would find at
    # release time instead.
    name: ${{ matrix.target }} / pg${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
        # amazon-2023 is absent, and not because of the majors it carries.
        #
        # It ships 15 through 18, so the driver's assumption that only some
        # majors are buildable there is not what stops it. Two other things
        # do, and neither is a version question. Its development package is
        # named postgresql<n>-server-devel where every other target in this
        # list calls it postgresql<n>-devel, so the image installs a package
        # that does not exist. And its PostgreSQL lives at /usr/lib64/pgsql
        # rather than the /usr/pgsql-<n> the spec names, so even with the
        # right package the build would look for pgxs where there is none.
        #
        # Listing it here would mean three cells that cannot go green, which
        # teaches a reader to ignore this workflow. It stays a target of
        # scripts/package.sh, where it is a request someone makes on purpose.
        target:
          - el-8
          - el-9
          - el-10
          - debian-12
          - debian-13
          - ubuntu-24.04
          - ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Build the package
        run: ./scripts/package.sh --pg ${{ matrix.pg }} --target ${{ matrix.target }}

      # The build succeeding says the spec parses and the files exist. It says
      # nothing about WHICH files, and three of the decisions this repository
      # makes about its packages are invisible to a build that works:
      #
      #   the diagnostic extension is deliberately absent, because it carries
      #   entry points that dial a host and port given as arguments;
      #
      #   libvalkey is linked statically, so its licence has to travel with
      #   the binary that contains it;
      #
      #   the wrapper's own extension has to actually be there, which is the
      #   assertion that would catch an exclusion written one glob too wide.
      #
      # A build alone would let any of the three silently reverse.
      - name: The package contains what the tree says it contains
        run: |
          set -euo pipefail
          shopt -s nullglob

          fail=0
          check() {  # check <description> <condition-already-evaluated>
            if [ "$2" = yes ]; then
              printf 'ok    %s\n' "$1"
            else
              printf 'NOT OK %s\n' "$1" >&2
              fail=1
            fi
          }

          case "${{ matrix.target }}" in
            el-*|amazon-*) family=rpm ;;
            *)             family=deb ;;
          esac

          if [ "$family" = rpm ]; then
            pkg=(dist/${{ matrix.target }}/*/*.rpm)
            [ ${#pkg[@]} -eq 1 ] || { echo "expected one rpm, found ${#pkg[@]}" >&2; exit 1; }
            # Listed from inside the image that built it, so no rpm tooling is
            # assumed on the runner.
            listing=$(docker run --rm -v "$PWD/dist:/d:ro" \
                        valkey_fdw/pkg-${{ matrix.target }}:pg${{ matrix.pg }} \
                        rpm -qlp "/d/${pkg[0]#dist/}")
            licence='LICENSE-libvalkey'
          else
            pkg=(dist/${{ matrix.target }}/*/*.deb)
            main=""
            for p in "${pkg[@]}"; do case "$p" in *dbgsym*) ;; *) main="$p" ;; esac; done
            [ -n "$main" ] || { echo "no non-dbgsym deb found" >&2; exit 1; }
            listing=$(dpkg-deb -c "$main" | awk '{print $NF}')
            licence='/copyright'
          fi

          echo "$listing"
          echo '---'

          grep -q 'extension/valkey_fdw\.control'   <<<"$listing" && a=yes || a=no
          grep -q 'extension/valkey_fdw--.*\.sql'   <<<"$listing" && b=yes || b=no
          grep -q 'valkey_fdw_test'                 <<<"$listing" && c=yes || c=no
          grep -q "$licence"                        <<<"$listing" && d=yes || d=no

          check 'the wrapper extension ships'                 "$a"
          check 'its SQL script ships'                        "$b"
          check 'the diagnostic extension does NOT ship'      "$([ "$c" = yes ] && echo no || echo yes)"
          check 'the libvalkey licence travels with it'       "$d"

          exit $fail

      # Contents are not installability. The assertions above read a file
      # list out of an archive, which says nothing about whether the package
      # can be put on a machine: a binary that ended up linked against a
      # library the target does not have produces a perfect file list and an
      # unsatisfiable dependency. That happened - a working tree carrying
      # objects from another build had them packaged instead of the ones this
      # spec builds, and the result required two sonames no EL box has.
      - name: The package installs
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            el-8)        img=oraclelinux:8 ;;
            el-9)        img=oraclelinux:9 ;;
            el-10)       img=oraclelinux:10 ;;
            debian-12)   img=debian:12 ;;
            debian-13)   img=debian:13 ;;
            ubuntu-24.04) img=ubuntu:24.04 ;;
            ubuntu-26.04) img=ubuntu:26.04 ;;
            *) echo "no verification image for ${{ matrix.target }}" >&2; exit 1 ;;
          esac

          case "${{ matrix.target }}" in
            el-*)
              pkg=$(ls dist/${{ matrix.target }}/*/*.rpm)
              docker run --rm -v "$PWD/dist:/d:ro" -e "PKG=${pkg#dist/}" "$img" bash -lc '
                set -e
                dnf install -y -q dnf-plugins-core >/dev/null 2>&1
                el=$(rpm -E %rhel)
                dnf install -y -q "https://download.postgresql.org/pub/repos/yum/reporpms/EL-${el}-x86_64/pgdg-redhat-repo-latest.noarch.rpm" >/dev/null 2>&1
                dnf -qy module disable postgresql >/dev/null 2>&1
                dnf install -y "/d/${PKG}"
                echo "installed; dependencies satisfied"
              '
              ;;
            *)
              pkg=$(ls dist/${{ matrix.target }}/*/*.deb | grep -v dbgsym | head -1)
              docker run --rm -v "$PWD/dist:/d:ro" -e "PKG=${pkg#dist/}" "$img" bash -lc '
                set -e
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq curl ca-certificates gnupg lsb-release >/dev/null
                install -d /usr/share/postgresql-common/pgdg
                curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                  -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
                echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
                  > /etc/apt/sources.list.d/pgdg.list
                apt-get update -qq
                apt-get install -y "/d/${PKG}"
                echo "installed; dependencies satisfied"
              '
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-pg${{ matrix.pg }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
